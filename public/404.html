<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>404 · Aarush Goradia</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#131413" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400&family=Instrument+Serif:ital@0;1&family=Newsreader:opsz,wght@6..72,400&display=swap" />
    <style>
      :root { --bg: #131413; --fg: #edece7; --body: #c3c1b9; --muted: #918f87; --accent: #9fd0b3; color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 400 18px/1.6 Newsreader, 'Iowan Old Style', Georgia, serif;
        -webkit-font-smoothing: antialiased;
        padding-left: max(20px, env(safe-area-inset-left, 0px));
        padding-right: max(20px, env(safe-area-inset-right, 0px));
      }
      main { width: 100%; max-width: 520px; }
      .big { font: italic 400 88px/1 'Instrument Serif', Georgia, serif; letter-spacing: -0.015em; color: var(--accent); margin: 0 0 22px; }
      p { margin: 0; color: var(--body); overflow-wrap: anywhere; }
      .path { font: 400 14px/1.6 'IBM Plex Sans', system-ui, sans-serif; color: var(--muted); margin-top: 4px; }
      .home { margin-top: 20px; }
      a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: rgba(159, 208, 179, 0.4); }
      a:hover { text-decoration-color: currentColor; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="big">404</p>
      <p>nothing lives here.</p>
      <p class="path" id="path"></p>
      <p class="home"><a href="/">back to the front page</a></p>
    </main>
    <script>
      document.getElementById('path').textContent = decodeURIComponent(location.pathname)
    </script>
  </body>
</html>
